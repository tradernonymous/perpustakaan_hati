<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpustakaan Hati 3D hero preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0c; color: #e6e2da; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid #2a2a2e; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 auto 0 0; }
  button { background: #17171a; color: #e6e2da; border: 1px solid #2a2a2e; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #c9a86a; }
  button:focus-visible { outline: 2px solid #c9a86a; outline-offset: 2px; }
  #status { color: #a49c8d; font-size: 13px; }
  #error { color: #f0a3a0; padding: 12px 16px; }
  #error[hidden] { display: none; }
  #stage { flex: 1; min-height: 320px; position: relative; }
  #stage canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>Perpustakaan Hati 3D hero</h1>
  <button id="reset" type="button">Reset view</button>
  <button id="motion" type="button" aria-pressed="true">Pause motion</button>
  <span id="status">Loading…</span>
</header>
<div id="error" hidden></div>
<div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
// Sam-style easing: 0 to 1 and back to 0 over `period` seconds.
const wave = (t, period) => 0.5 - 0.5 * Math.cos((TAU * t) / period);
const mod = (a, b) => ((a % b) + b) % b;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
// Gaussian bump centred on `center` with the given width, used for the heartbeat shape.
const pulseAt = (x, center, width) => Math.exp(-(((x - center) / width) ** 2));

// Timing. BEAT is the heartbeat period. Each beat sends out one wave, and WAVE_LIFE is how long a wave takes to fade.
const BEAT = 1.4;
const WAVE_LIFE = 1.8;
const WAVE_COUNT = 3;
const ORBIT_SPEED = 0.12;   // radians per second for the ebook orbit
const CLEAN_POSE_TIME = 0.8; // pose used when motion is off


// Assets live in the project, so paths are relative to the project root.
const EMBLEM_URL = 'apps/web/public/brand/emblem-book-heart.svg';
// Cover art from apps/web/public/ebooks. `back` is the tier colour from design-tokens.css.
const COVERS = [
  { name: 'Edisi Poket', src: 'apps/web/public/ebooks/cover-poket.png', back: 0x5b9b7d, phase: 0 },
  { name: 'Edisi Membangun', src: 'apps/web/public/ebooks/cover-membangun.png', back: 0xc9a86a, phase: TAU / 3 },
  { name: 'Teman Hidup', src: 'apps/web/public/ebooks/cover-teman-hidup.png', back: 0x5c1e17, phase: (2 * TAU) / 3 },
];

const stage = document.getElementById('stage');
const resetButton = document.getElementById('reset');
const motionButton = document.getElementById('motion');
const statusText = document.getElementById('status');
const errorBox = document.getElementById('error');

// ?t=7.2 renders a single frozen pose at that time in seconds (used for screenshots).
const fixedTime = (() => {
  const raw = new URLSearchParams(location.search).get('t');
  const value = raw === null ? NaN : Number(raw);
  return Number.isFinite(value) ? value : null;
})();


// Pointer position inside the stage, -1 to 1. Positive y is down the screen.
const pointer = { x: 0, y: 0 };
stage.addEventListener('pointermove', (e) => {
  const r = stage.getBoundingClientRect();
  pointer.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / (r.width || 1)) * 2 - 1));
  pointer.y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / (r.height || 1)) * 2 - 1));
});
const resetPointer = () => {
  pointer.x = 0;
  pointer.y = 0;
};
stage.addEventListener('pointerleave', resetPointer);
stage.addEventListener('pointercancel', resetPointer);

// Skip rendering while the hero is scrolled off-screen or the tab is hidden.
let inView = true;
new IntersectionObserver((entries) => {
  inView = entries[entries.length - 1].isIntersecting;
}).observe(stage);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let motionOn = !reduceMotion && fixedTime === null;
const syncMotionButton = () => {
  motionButton.setAttribute('aria-pressed', String(motionOn));
  motionButton.textContent = motionOn ? 'Pause motion' : 'Play motion';
};
syncMotionButton();
motionButton.addEventListener('click', () => {
  motionOn = !motionOn;
  syncMotionButton();
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
const pixelRatio = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(pixelRatio);
renderer.setClearColor(0x0a0a0c, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.6;
controls.maxDistance = 5;


function resetView() {
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0.15, 3.0);
  controls.update();
}
resetView();

function resize() {
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);
  
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const textureLoader = new THREE.TextureLoader();
function loadTexture(url) {
  return new Promise((resolve, reject) => {
    textureLoader.load(
      url,
      (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        resolve(texture);
      },
      undefined,
      () => reject(new Error('Missing asset: ' + url)),
    );
  });
}

// Soft gold glow behind the emblem, like the lantern glow in the emblem SVG.
function makeHalo() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(201, 168, 106, 0.34)');
  gradient.addColorStop(1, 'rgba(201, 168, 106, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    opacity: 0.6,
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), material);
}

// Soft radial glow texture tinted with one colour. It is used on an additive sprite behind each element.
function makeGlowTexture(hex) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const r = (hex >> 16) & 255;
  const g = (hex >> 8) & 255;
  const b = hex & 255;
  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.9)`);
  gradient.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, 0.35)`);
  gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeGlowSprite(hex, size, opacity) {
  const material = new THREE.SpriteMaterial({
    map: makeGlowTexture(hex),
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(material);
  sprite.scale.setScalar(size);
  return sprite;
}

function buildScene(emblemTexture, coverTextures) {
  const rig = new THREE.Group();
  scene.add(rig);

  // Halo sits furthest back.
  const halo = makeHalo();
  halo.position.set(0, 0, -0.12);
  rig.add(halo);

  // Faint polar grid under the emblem: a map context with no text.
  const grid = new THREE.PolarGridHelper(1.6, 16, 6, 64, 0xc9a86a, 0x7db895);
  grid.position.y = -0.62;
  grid.material.transparent = true;
  grid.material.opacity = 0.14;
  grid.material.depthWrite = false;
  rig.add(grid);

  // Heartbeat waves: rings that expand from the emblem and fade. One wave starts on each beat.
  const waves = Array.from({ length: WAVE_COUNT }, () => {
    const mesh = new THREE.Mesh(
      new THREE.RingGeometry(0.9, 0.93, 96),
      new THREE.MeshBasicMaterial({
        color: 0x9de1c1,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        side: THREE.DoubleSide,
      }),
    );
    mesh.position.z = -0.05;
    rig.add(mesh);
    return mesh;
  });

  // Emblem: the book-heart SVG on a plane. Unlit basic material keeps the brand colours exact.
  const emblemWidth = 1.2;
  const emblemHeight = emblemWidth * (emblemTexture.image.height / emblemTexture.image.width);
  const emblem = new THREE.Mesh(
    new THREE.PlaneGeometry(emblemWidth, emblemHeight),
    new THREE.MeshBasicMaterial({ map: emblemTexture, transparent: true, depthWrite: false }),
  );
  emblem.renderOrder = 2;
  const pivot = new THREE.Group();
  pivot.add(emblem);
  // Gold glow behind the emblem. It is additive, so the emblem colours are not changed.
  const emblemGlow = makeGlowSprite(0xc9a86a, 1.6, 0.4);
  emblemGlow.position.z = -0.08;
  pivot.add(emblemGlow);
  rig.add(pivot);


  // Ebook covers, each with a tier-coloured back and spine.
  const covers = COVERS.map((cover, i) => {
    const texture = coverTextures[i];
    const width = 0.42;
    const height = width * (texture.image.height / texture.image.width);
    const frontMaterial = new THREE.MeshBasicMaterial({ map: texture });
    const backMaterial = new THREE.MeshBasicMaterial({ color: cover.back });

    const group = new THREE.Group();
    const front = new THREE.Mesh(new THREE.PlaneGeometry(width, height), frontMaterial);
    front.position.z = 0.006;
    const back = new THREE.Mesh(new THREE.PlaneGeometry(width, height), backMaterial);
    back.rotation.y = Math.PI;
    back.position.z = -0.006;
    const spine = new THREE.Mesh(
      new THREE.BoxGeometry(0.014, height, 0.012),
      new THREE.MeshBasicMaterial({ color: cover.back }),
    );
    spine.position.x = -width / 2;
    group.add(front, back, spine);
    // Soft glow in the cover's tier colour, behind the cover.
    const glow = makeGlowSprite(cover.back, width * 2.2, 0.3);
    glow.position.z = -0.03;
    group.add(glow);
    rig.add(group);

    return { group, frontMaterial, phase: cover.phase, index: i };
  });

  const smoothPointer = { x: 0, y: 0 };
  let smoothScroll = 0;

  return function animate(t, dt = 0) {

    // Pointer and scroll follow with lag. dt is 0 for a frozen pose, so both stay at rest.
    const follow = 1 - Math.exp(-dt * 3);
    smoothPointer.x += (pointer.x - smoothPointer.x) * follow;
    smoothPointer.y += (pointer.y - smoothPointer.y) * follow;
    const scrollTarget = clamp01(window.scrollY / Math.max(1, window.innerHeight));
    smoothScroll += (scrollTarget - smoothScroll) * follow;

    rig.position.y = -0.012 * wave(t, 6);
    rig.rotation.y = 0.6 * smoothScroll;

    // Emblem sways gently and turns toward the pointer.
    pivot.rotation.y = 0.25 * Math.sin((TAU * t) / 4.5) + 0.25 * smoothPointer.x;
    pivot.rotation.x = 0.12 * smoothPointer.y;

    // Heartbeat: a "lub" then a softer "dub" in each beat. The emblem swells on both.
    const beatPhase = mod(t, BEAT) / BEAT;
    const beat = pulseAt(beatPhase, 0.05, 0.05) + 0.6 * pulseAt(beatPhase, 0.25, 0.05);
    pivot.scale.setScalar(1 + 0.04 * beat);

    // Waves leave the emblem on every beat. Older waves are the ones with a higher j index.
    const cycle = mod(t, BEAT);
    waves.forEach((mesh, j) => {
      const p = clamp01((cycle + j * BEAT) / WAVE_LIFE);
      const eased = 1 - (1 - p) * (1 - p);
      mesh.scale.setScalar(0.7 + 1.3 * eased);
      mesh.material.opacity = 0.7 * (1 - p) * (1 - p);
    });


    // Covers orbit the emblem on an ellipse. Back covers pass behind it.
    for (const item of covers) {
      const a = item.phase + t * ORBIT_SPEED + 0.25 * smoothPointer.x;
      item.group.position.x = 0.85 * Math.sin(a);
      item.group.position.z = 0.5 * Math.cos(a);
      item.group.position.y = 0.06 * Math.sin(2 * a) + 0.02 * Math.sin((TAU * t) / 5 + item.index) + 0.02 * beat;
      item.group.rotation.y = -0.45 * Math.sin(a);
      // Faint gold pulse on the cover art. Peak brightness is the original colour.
      item.frontMaterial.color.setScalar(0.88 + 0.12 * wave(t, 4));
    }

    halo.scale.setScalar(0.92 + 0.14 * wave(t, 4) + 0.12 * beat);
    halo.material.opacity = 0.25 + 0.15 * wave(t, 4);
    grid.rotation.y = t * 0.04;
  };
}

let animate = null;
let time = 0;
const clock = new THREE.Clock();

async function init() {
  statusText.textContent = 'Loading…';
  errorBox.hidden = true;
  try {
    const [emblemTexture, ...coverTextures] = await Promise.all([
      loadTexture(EMBLEM_URL),
      ...COVERS.map((cover) => loadTexture(cover.src)),
    ]);
    animate = buildScene(emblemTexture, coverTextures);
    // With motion off, show a clean pose instead of a moving frame.
    if (!motionOn) animate(fixedTime === null ? CLEAN_POSE_TIME : fixedTime, 0);
    statusText.textContent = 'Drag to orbit, scroll to zoom';
  } catch (err) {
    errorBox.textContent = 'Could not load the scene: ' + (err && err.message ? err.message : err);
    errorBox.hidden = false;
    statusText.textContent = 'Error';
  }
}

resetButton.addEventListener('click', resetView);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!inView || document.hidden) return;
  if (animate && motionOn) {
    time += dt;
    animate(time, dt);
  }
  controls.update();
  renderer.render(scene, camera);
});

init();
</script>
</body>
</html>
