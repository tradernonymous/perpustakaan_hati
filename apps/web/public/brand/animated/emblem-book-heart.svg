<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Perpustakaan Hati book-heart emblem">
  <style>
    /* build-animated-logos.py: every animation ends on the original artwork */
    @keyframes phx-rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes phx-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes phx-twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.6); } }
    .phx-rise { animation: phx-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards; }
    .phx-draw { stroke-dasharray: 1; animation: phx-draw 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.45s backwards; }
    .phx-trace { stroke-dasharray: 1; animation: phx-draw 1.2s cubic-bezier(0.65, 0, 0.35, 1) 1.35s backwards; }
    .phx-twinkle { transform-box: fill-box; transform-origin: center; animation: phx-twinkle 4.8s ease-in-out 2.6s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!--
    Perpustakaan Hati — book-heart emblem (Design System 3.1)
    Source: docs/brand/visual-identity.md -> "Design System 3.1"
    An emerald-bound open book; a foil heart rises from the spine.
    3D: extruded cover board + heart tube, lighting-filter bevel, gilt
    page block, spine shadow, one glint. Transparent background.
    Minimum size: 48px wide (below that use monogram-stamp.svg).
  -->
  <defs>
    <linearGradient id="phe-foil-gold" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.2" stop-color="#f0d08e"/>
      <stop offset="0.46" stop-color="#c49a52"/>
      <stop offset="0.54" stop-color="#9a7638"/>
      <stop offset="0.62" stop-color="#d9b46c"/>
      <stop offset="0.84" stop-color="#f6e2ad"/>
      <stop offset="1" stop-color="#b8904a"/>
    </linearGradient>
    <linearGradient id="phe-foil-emerald" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#e3f7e8"/>
      <stop offset="0.2" stop-color="#9edab2"/>
      <stop offset="0.46" stop-color="#3f9167"/>
      <stop offset="0.54" stop-color="#2d7954"/>
      <stop offset="0.62" stop-color="#4fa477"/>
      <stop offset="0.84" stop-color="#b6e3c4"/>
      <stop offset="1" stop-color="#3f9167"/>
    </linearGradient>
    <linearGradient id="phe-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef4"/>
      <stop offset="0.65" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#eae2d4"/>
    </linearGradient>
    <linearGradient id="phe-page-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d79b"/>
      <stop offset="1" stop-color="#9a7638"/>
    </linearGradient>
    <linearGradient id="phe-cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7954"/>
      <stop offset="0.55" stop-color="#1d5a3d"/>
      <stop offset="1" stop-color="#0b2418"/>
    </linearGradient>
    <radialGradient id="phe-lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b85c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f2b85c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2b85c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phe-emerald-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3f9167" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f9167" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phe-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="phe-glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#fff4d6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="phe-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="phe-contact" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="phe-bevel" x="-5%" y="-10%" width="110%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="3.2" diffuseConstant="1" lighting-color="#fff" result="d">
        <feDistantLight azimuth="235" elevation="50"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="0.75" k2="0.42" k3="0" k4="0" result="shaded"/>
      <feSpecularLighting in="h" surfaceScale="3.2" specularConstant="0.85" specularExponent="26"
                          lighting-color="#fffbe8" result="s">
        <feDistantLight azimuth="235" elevation="42"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
      <feComposite in="shaded" in2="sIn" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="phe-bevel-soft" x="-5%" y="-10%" width="110%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.0" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="4.5" diffuseConstant="1" lighting-color="#fff" result="d">
        <feDistantLight azimuth="235" elevation="50"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="0.75" k2="0.42" k3="0" k4="0" result="shaded"/>
      <feSpecularLighting in="h" surfaceScale="4.5" specularConstant="0.85" specularExponent="26"
                          lighting-color="#fffbe8" result="s">
        <feDistantLight azimuth="235" elevation="42"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
      <feComposite in="shaded" in2="sIn" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="phe-deboss" x="-5%" y="-20%" width="110%" height="140%">
      <feOffset in="SourceAlpha" dx="0" dy="2.2" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="topEdge"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="topEdge" operator="in" result="shade"/>
      <feOffset in="SourceAlpha" dx="0" dy="1.6" result="lowAlpha"/>
      <feComposite in="lowAlpha" in2="SourceAlpha" operator="out" result="catch"/>
      <feFlood flood-color="#fff" flood-opacity="0.28"/>
      <feComposite in2="catch" operator="in" result="light"/>
      <feMerge><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="300" cy="170" rx="210" ry="170" fill="url(#phe-lantern)"/>
  <g class="phx-rise">
