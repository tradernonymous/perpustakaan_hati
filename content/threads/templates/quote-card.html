<!DOCTYPE html>
<!--
  Perpustakaan Hati — Threads quote card template
  Size: 1080x1350 (4:5). Render to PNG via Playwright/Chromium in Phase 3.
  Source: docs/brand/ui-kit.md -> "Threads Visual Kit"
  Placeholders: {{QUOTE}}, {{KICKER}}, {{TIER}} + tier class on .card
-->
<html lang="ms">
<head>
<meta charset="utf-8" />
<title>Threads Quote Card</title>
<link rel="stylesheet" href="../../../docs/brand/design-tokens.css" />
<style>
  @page { size: 1080px 1350px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* v3 "Gilded Grove": tokens come from design-tokens.css; the inline
     values below are kept so the card still renders if opened alone. */
  :root {
    --forest-night: #07140d;
    --ink: #0a0a0c;
    --gold: #c9a86a;
    --gold-light: #e9cea2;
    --gold-deep: #a07b45;
    --terracotta: #da725b;
    --green-950: #0b2418;
    --green-900: #123d2a;
    --green-800: #1d5a3d;
    --green-700: #2d7954;
    --green-600: #3f9167;
    --green: #5b9b7d;
    --green-light: #7db895;
    --green-300: #a7d3b6;
    --green-200: #cbe8d5;
    --green-100: #e4f4e9;
    --lime-glow: #c8e986;
    --mint-glass: #9de1c1;
    --burgundy: #5c1e17;
    --burgundy-light: #c25a58;
  }


  /* Brand fonts, self-hosted and subset.
     Source: packages/brand-tools/fonts/ */
  @font-face {
    font-family: 'Fraunces';
    src: url('../../../packages/brand-tools/fonts/FrauncesDisplay.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Fraunces';
    src: url('../../../packages/brand-tools/fonts/FrauncesDisplayItalic.woff2') format('woff2');
    font-weight: 400 700; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../../packages/brand-tools/fonts/InterUI.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: var(--forest-night);
    color: var(--gold-light);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
  }

  /* inner gold border */
  .card::before {
    content: '';
    position: absolute;
    inset: 44px;
    border: 1px solid var(--gold-deep);
    pointer-events: none;
  }

  .kicker {
    font-size: 28px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .quote {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 68px;
    line-height: 1.2;
    margin-top: 96px;
    flex: 1;
    display: flex;
    align-items: center;
    max-width: 860px;
  }

  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 40px;
    letter-spacing: 0.22em;
    color: var(--gold);
  }

  .tier-badge {
    font-size: 24px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 14px 26px;
    border: 2px solid var(--tier-color, var(--green));
    color: var(--tier-color, var(--green));
  }

  .healing-bar {
    width: 90px;
    height: 8px;
    background: var(--green);
    margin-top: 28px;
  }

  /* tier variants */
  .tier-free     { --tier-color: var(--green); }
  .tier-standard { --tier-color: var(--gold); }
  .tier-premium  { --tier-color: var(--burgundy-light); }

  /* v3 additions */
  .emblem { width: 180px; display: block; margin-bottom: 18px; filter: drop-shadow(0 12px 24px rgb(0 0 0 / 0.5)); }
  .wordmark.ph-foil-gold { font-size: 40px; }
</style>
</head>
<body>
  <div class="card ph-stage tier-free">
    <img class="emblem" src="../../../docs/brand/assets/emblem-book-heart.svg" alt="" />
    <div class="kicker">— @rahimam —</div>
    <p class="quote">{{QUOTE}}</p>
    <div class="footer">
      <div>
        <div class="wordmark ph-foil-gold">PERPUSTAKAAN HATI</div>
        <div class="healing-bar"></div>
      </div>
      <div class="tier-badge">{{TIER}}</div>
    </div>
  </div>
</body>
</html>
