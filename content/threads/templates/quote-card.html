<!DOCTYPE html>
<!--
  Perpustakaan Hati — Threads quote card template
  Size: 1080x1350 (4:5). Render to PNG via Playwright/Chromium in Phase 3.
  Source: docs/brand/ui-kit.md -> "Threads Visual Kit"
  Placeholders: {{QUOTE}}, {{KICKER}}, {{TIER}} + tier class on .card
-->
<html lang="ms">
<head>
<meta charset="utf-8" />
<title>Threads Quote Card</title>
<style>
  @page { size: 1080px 1350px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0c;
    --gold: #c9a86a;
    --gold-light: #e9cea2;
    --gold-deep: #a07b45;
    --terracotta: #da725b;
    --olive: #5f6f4a;
    --burgundy: #5c1e17;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: var(--ink);
    color: var(--gold-light);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
  }

  /* inner gold border */
  .card::before {
    content: '';
    position: absolute;
    inset: 44px;
    border: 1px solid var(--gold-deep);
    pointer-events: none;
  }

  .kicker {
    font-size: 28px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .quote {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 68px;
    line-height: 1.2;
    margin-top: 96px;
    flex: 1;
    display: flex;
    align-items: center;
    max-width: 860px;
  }

  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .wordmark {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 40px;
    letter-spacing: 0.22em;
    color: var(--gold);
  }

  .tier-badge {
    font-size: 24px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 14px 26px;
    border: 2px solid var(--tier-color, var(--olive));
    color: var(--tier-color, var(--olive));
  }

  .healing-bar {
    width: 90px;
    height: 8px;
    background: var(--olive);
    margin-top: 28px;
  }

  /* tier variants */
  .tier-free     { --tier-color: var(--olive); }
  .tier-standard { --tier-color: var(--gold); }
  .tier-premium  { --tier-color: var(--burgundy); }
</style>
</head>
<body>
  <div class="card tier-free">
    <div class="kicker">— @rahimam —</div>
    <p class="quote">{{QUOTE}}</p>
    <div class="footer">
      <div>
        <div class="wordmark">PERPUSTAKAAN HATI</div>
        <div class="healing-bar"></div>
      </div>
      <div class="tier-badge">{{TIER}}</div>
    </div>
  </div>
</body>
</html>
