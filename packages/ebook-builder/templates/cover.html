<!DOCTYPE html>
<!--
  Perpustakaan Hati — eBook cover template, Design System 3.0 "Gilded Grove"
  6x9in = 1200x1800px at 200dpi. Render to PNG/PDF via Playwright/Chromium.
  Source: docs/brand/ui-kit.md -> "eBook Layout Templates" -> cover
  Placeholders: {{TITLE}}, {{TIER}}, {{SUBTITLE}} + tier class on .cover
  Tier classes: tier-free (green), tier-standard (gold), tier-premium (burgundy)

  v3 recipe: forest-night ground + emerald glow + lantern glow + vignette,
  book-heart emblem, gold-foil series line, emerald ribbon, tier seal.
  Green leads; gold frames; ruby only inside the emblem heart.
-->
<html lang="ms">
<head>
<meta charset="utf-8" />
<title>Perpustakaan Hati — Cover</title>
<link rel="stylesheet" href="../../../docs/brand/design-tokens.css" />
<style>
  @page { size: 1200px 1800px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Brand fonts, self-hosted and subset. Source: packages/brand-tools/fonts/ */
  @font-face {
    font-family: 'Fraunces';
    src: url('../../brand-tools/fonts/FrauncesDisplay.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Fraunces';
    src: url('../../brand-tools/fonts/FrauncesDisplayItalic.woff2') format('woff2');
    font-weight: 400 700; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../brand-tools/fonts/InterUI.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Source Serif 4';
    src: url('../../brand-tools/fonts/SourceSerifText.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }

  body {
    width: 1200px;
    height: 1800px;
    background: var(--forest-night);
    color: var(--gold-light);
    font-family: var(--font-body);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* .ph-stage (design-tokens.css) supplies ground + glows + vignette + grain */
  .cover {
    --accent: var(--green-400);
    position: relative;
    width: 1200px;
    height: 1800px;
    padding: 140px 110px 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  /* double gilt frame */
  .cover::before {
    content: '';
    position: absolute;
    inset: 56px;
    border: 2px solid var(--gold-deep);
    outline: 1px solid rgb(201 168 106 / 0.35);
    outline-offset: -16px;
    pointer-events: none;
  }

  .emblem { width: 340px; filter: drop-shadow(0 20px 40px rgb(0 0 0 / 0.5)); }

  .wordmark {
    font-family: var(--font-display);
    font-size: 62px;
    line-height: 1.05;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 14px;
  }
  .wordmark span { display: block; }
  .wordmark .hati { font-size: 150px; letter-spacing: 0.08em; }

  .kicker { width: 620px; margin-top: 26px; font-size: 22px; }

  .title {
    font-family: var(--font-display);
    font-size: 88px;
    line-height: 1.08;
    font-weight: 500;
    color: var(--cream);
    margin-top: 80px;
    max-width: 920px;
    text-shadow: 0 4px 24px rgb(0 0 0 / 0.6);
  }

  .ribbon { margin-top: 44px; font-size: 38px; }

  .subtitle {
    font-family: var(--font-reading);
    font-style: italic;
    font-size: 36px;
    line-height: 1.45;
    color: var(--green-300);
    margin-top: 40px;
    max-width: 760px;
  }

  /* tier seal: one per tier, shown by the tier class on .cover */
  .seal { position: absolute; right: 100px; bottom: 200px; width: 240px; display: none;
          filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.55)); transform: rotate(-8deg); }
  .tier-free     .seal-free,
  .tier-standard .seal-standard,
  .tier-premium  .seal-premium { display: block; }

  .byline {
    position: absolute;
    bottom: 128px;
    left: 50%;
    width: 560px;
    transform: translateX(-50%);
    font-size: 24px;
  }

  /* tier accent (badge text on forest-night — all pass 4.5:1) */
  .tier-free     { --accent: var(--green-400); }
  .tier-standard { --accent: var(--gold); }
  .tier-premium  { --accent: var(--burgundy-light); }
</style>
</head>
<body>
  <div class="cover ph-stage tier-free">
    <img class="emblem" src="../../../docs/brand/assets/emblem-book-heart.svg" alt="" />
    <div class="wordmark">
      <span class="ph-foil-gold">Perpustakaan</span>
      <span class="hati ph-foil-emerald">Hati</span>
    </div>
    <div class="kicker ph-kicker">Koleksi Ebook</div>

    <h1 class="title">{{TITLE}}</h1>
    <div class="ribbon ph-ribbon">{{TIER}}</div>
    <p class="subtitle">{{SUBTITLE}}</p>

    <img class="seal seal-free" src="../../../docs/brand/assets/seal-edisi-poket.svg" alt="Edisi Poket" />
    <img class="seal seal-standard" src="../../../docs/brand/assets/seal-edisi-membangun.svg" alt="Edisi Membangun" />
    <img class="seal seal-premium" src="../../../docs/brand/assets/seal-teman-hidup.svg" alt="Teman Hidup" />

    <div class="byline ph-kicker">by @rahimam</div>
  </div>
</body>
</html>
