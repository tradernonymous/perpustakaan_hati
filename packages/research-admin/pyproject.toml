[project]
name = "research-admin"
version = "0.1.0"
description = "Threads OAuth + OpenRouter research admin backend for Perpustakaan Hati"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_admin"]
