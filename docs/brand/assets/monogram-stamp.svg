<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Perpustakaan Hati compact mark">
  <!--
    Perpustakaan Hati — compact monogram / stamp source (production SVG)
    Source: docs/brand/visual-identity.md -> "Logo & watermark stamp"
    Use for: favicon, avatar, cover badge, small footer lockup.
  -->
  <rect width="1200" height="1200" fill="#0a0a0c"/>

  <!-- double frame -->
  <rect x="140" y="140" width="920" height="920" fill="none" stroke="#a07b45" stroke-width="6"/>
  <rect x="170" y="170" width="860" height="860" fill="none" stroke="#c9a86a" stroke-width="1.5"/>

  <!-- monogram PH -->
  <text x="600" y="690"
        font-family="Playfair Display, Georgia, serif"
        font-size="420"
        text-anchor="middle"
        fill="#c9a86a">PH</text>

  <!-- healing marker bar -->
  <rect x="470" y="760" width="260" height="10" fill="#5f6f4a"/>

  <!-- footer wordmark -->
  <text x="600" y="960"
        font-family="Inter, system-ui, sans-serif"
        font-size="46"
        letter-spacing="14"
        text-anchor="middle"
        fill="#e9cea2">PERPUSTAKAAN HATI</text>
</svg>
