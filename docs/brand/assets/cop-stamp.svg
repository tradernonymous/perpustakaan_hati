  <line x1="180" y1="168" x2="720" y2="168" stroke="#a07b45" stroke-width="2"/>

  <text x="450" y="212"
        font-family="Inter, system-ui, sans-serif"
        font-size="26"
        letter-spacing="6"
        text-anchor="middle"
        fill="#e9cea2">NAMA PEMBELI · CONTOH@EMAIL.COM</text>

  <rect x="395" y="228" width="110" height="6" fill="#5f6f4a"/>
