<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Cop Perpustakaan Hati watermark stamp">
  <!--
    Perpustakaan Hati — "Cop Perpustakaan Hati" watermark stamp (production SVG)
    Source: docs/brand/visual-identity.md -> "Logo & watermark stamp"
    Placement: bottom-right of every paid eBook page, rotated -20deg by the
